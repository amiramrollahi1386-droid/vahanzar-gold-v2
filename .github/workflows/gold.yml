name: gold-prices

on:
  schedule:
    - cron: "7,27,47 5-15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: gold
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Load original bot code
        run: |
          curl -fsSL -o gold_bot.py https://raw.githubusercontent.com/amiramrollahi1386-droid/vahanzar-gold/main/gold_bot.py
          curl -fsSL -o design.py https://raw.githubusercontent.com/amiramrollahi1386-droid/vahanzar-gold/main/design.py
          curl -fsSL -o content.py https://raw.githubusercontent.com/amiramrollahi1386-droid/vahanzar-gold/main/content.py
          python -c "import gold_bot, design, content; print('bot modules ok')"
      - name: Send prices
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          REQUEST_CURL: ${{ secrets.REQUEST_CURL }}
          ADMIN_CHAT_ID: ${{ secrets.ADMIN_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          CHANNEL_ID: "@vahanzar"
          FOOTER_TEXT: "@vahanzar"
          BRAND_NAME: "وهان زر"
          ORDER_PHONE: "09123900723"
          ADDRESS_TEXT: "تقاطع کریمخان و حافظ، مجتمع تجاری الماس کریمخان، همکف، پلاک ۸۷"
          TRUST_TEXT: "فاکتور معتبر، کد ری‌گیری، جواز صنف، تحویل حضوری"
          ABSHODE_DIVISOR: "4.3318"
          PRICE_SOURCE: "panel"
          SITE_SYNC: "1"
          SITE_API_URL: "https://jquffpllnzbuhiyfrori.supabase.co"
          SITE_API_KEY: "sb_publishable_tEr6QjE51hNCRxTkOAf-NA_iy2_78La"
          INTERVAL_MINUTES: "10"
          START_HOUR: "10"
          END_HOUR: "20"
          DEMO: "0"
          TZ: "Asia/Tehran"
        run: |
       echo "BOT_START_TS=$(date +%s)" >> "$GITHUB_ENV"
       python gold_bot.py --loop 340
      - name: Keep overnight chain alive
        if: success()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TZ: Asia/Tehran
        run: |
          python3 - << 'EOF'
          import os, time, datetime, requests
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Tehran")
          now = datetime.datetime.now(tz)
          if 10 <= now.hour < 20:
              print("Inside working hours; gold_bot.py already dispatched next run.")
              raise SystemExit(0)

          start_ts = float(os.getenv("BOT_START_TS") or time.time())
          if now.hour >= 20:
              next_open = (now + datetime.timedelta(days=1)).replace(hour=9, minute=50, second=0, microsecond=0)
          else:
              next_open = now.replace(hour=9, minute=50, second=0, microsecond=0)

          wake_ts = min(next_open.timestamp(), start_ts + 335 * 60)
          sleep_sec = max(0, wake_ts - time.time())
          print(f"Sleeping {int(sleep_sec)}s until {datetime.datetime.fromtimestamp(wake_ts, tz).strftime('%Y-%m-%d %H:%M:%S')} before chaining next run...")
          if sleep_sec > 0:
              time.sleep(sleep_sec)

          tok = os.getenv("GITHUB_TOKEN")
          repo = os.getenv("GITHUB_REPOSITORY")
          wf = os.getenv("GH_WORKFLOW_FILE", "gold.yml")
          ref = os.getenv("GITHUB_REF_NAME", "main")
          r = requests.post(
              f"https://api.github.com/repos/{repo}/actions/workflows/{wf}/dispatches",
              headers={"Authorization": f"Bearer {tok}", "Accept": "application/vnd.github+json"},
              json={"ref": ref},
              timeout=20,
          )
          print("Overnight dispatch status:", r.status_code)
          EOF
